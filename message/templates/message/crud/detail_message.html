<!DOCTYPE html>
<html lang="en">
<head>
  {% include '../includes/head.html' %}
  <meta charset="UTF-8">
</head>
<body>
<a class="btn btn-sm btn-outline-secondary" href="{% url 'main_page:main_view' %}" role="button">Главная страница</a>
<form method="post">
    {% csrf_token %}
    <div class="album py-5 bg-body-tertiary">
      <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
          <div class="col">
            <div class="card shadow-sm">
              <div class="card-body">
                <p class="card-text">Шапка письма: {{ object.topic_mail }}</p>
                <p class="card-text">Тело письма: {{ object.body_mail }}</p>
                <div class="d-flex justify-content-between align-items-center">
                  <div class="btn-group">
                    <p> <a href="{% url 'message:forms_update' object.pk %}" class="btn btn-sm btn-outline-warning">Редактировать</a>
                    <p> <a href="{% url 'message:forms_delete' object.pk %}" class="btn btn-sm btn-outline-danger">Удалить</a>
                  </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
</form>
</body>
</html>
